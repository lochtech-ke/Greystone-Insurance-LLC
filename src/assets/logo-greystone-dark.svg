<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bronzeGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C29B5C" />
      <stop offset="50%" stop-color="#A67C3D" />
      <stop offset="100%" stop-color="#805B23" />
    </linearGradient>

    <linearGradient id="bronzeGlowDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="50%" stop-color="#A67C3D" stop-opacity="0.6" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>
  </defs>

  <!-- Emblem Icon: Institutional Stone Pillar Shield -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield Frame -->
    <path d="M 50,5 L 85,25 L 85,65 C 85,85 50,98 50,98 C 50,98 15,85 15,65 L 15,25 Z" 
          fill="#2A2722" stroke="url(#bronzeGradDark)" stroke-width="2.5" />
    
    <!-- Inner Geometric Pillars -->
    <path d="M 50,15 L 75,30 L 75,60 C 75,74 50,85 50,85 C 50,85 25,74 25,60 L 25,30 Z" 
          fill="none" stroke="url(#bronzeGradDark)" stroke-width="1" stroke-dasharray="3,2" opacity="0.6" />

    <!-- 3 Institutional Architectural Columns -->
    <rect x="32" y="32" width="6" height="34" rx="1" fill="url(#bronzeGradDark)" />
    <rect x="47" y="27" width="6" height="42" rx="1" fill="url(#bronzeGradDark)" />
    <rect x="62" y="32" width="6" height="34" rx="1" fill="url(#bronzeGradDark)" />

    <!-- Arch Top Architrave -->
    <path d="M 28,30 L 72,30 L 50,18 Z" fill="url(#bronzeGradDark)" />
    <!-- Pedestal Base -->
    <rect x="26" y="68" width="48" height="4" rx="1" fill="url(#bronzeGradDark)" />
    <!-- Center Core -->
    <polygon points="50,42 55,48 50,54 45,48" fill="#F6F2E8" />
  </g>

  <!-- Wordmark Text -->
  <text x="118" y="58" font-family="'Fraunces', Georgia, serif" font-size="38" font-weight="700" letter-spacing="3" fill="#F6F2E8">
    GREYSTONE
  </text>

  <text x="120" y="82" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="500" letter-spacing="6" fill="#A67C3D">
    INSURANCE LLC
  </text>

  <rect x="120" y="90" width="390" height="1" fill="url(#bronzeGlowDark)" />

  <text x="120" y="104" font-family="'IBM Plex Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="3" fill="#F6F2E8" opacity="0.7">
    YOUR RISK. OUR RESPONSIBILITY.
  </text>
</svg>
