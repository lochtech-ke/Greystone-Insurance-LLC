<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="favBronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A5810" />
      <stop offset="50%" stop-color="#674009" />
      <stop offset="100%" stop-color="#452904" />
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="20" fill="#1C1A17" />
  
  <!-- Outer Shield Frame -->
  <path d="M 50,10 L 82,28 L 82,62 C 82,80 50,92 50,92 C 50,92 18,80 18,62 L 18,28 Z" 
        fill="#2A2722" stroke="url(#favBronze)" stroke-width="2.5" />

  <!-- 3 Architectural Columns -->
  <rect x="34" y="36" width="6" height="30" rx="1" fill="url(#favBronze)" />
  <rect x="47" y="32" width="6" height="38" rx="1" fill="url(#favBronze)" />
  <rect x="60" y="36" width="6" height="30" rx="1" fill="url(#favBronze)" />

  <!-- Arch Top Architrave -->
  <path d="M 30,34 L 70,34 L 50,22 Z" fill="url(#favBronze)" />
  <!-- Base -->
  <rect x="28" y="68" width="44" height="4" rx="1" fill="url(#favBronze)" />
  <!-- Core -->
  <polygon points="50,44 54,50 50,56 46,50" fill="#F6F2E8" />
</svg>